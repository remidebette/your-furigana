[package]
name = "furigana-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Japanese tokenizer for Your Furigana: Lindera compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]

# Native tool compiling the IPADIC source into Lindera's dictionary files (see build.sh)
[[bin]]
name = "build-dict"
path = "src/bin/build_dict.rs"

[dependencies]
# Pinned: the dictionary files are only guaranteed to load with the version that built them
lindera = { version = "=6.2.0", default-features = false }
lindera-dictionary = { version = "=6.2.0", default-features = false }
# Must match the version of the wasm-bindgen CLI used in build.sh
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
